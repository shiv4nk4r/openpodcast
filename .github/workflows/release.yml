# Build macOS + Windows installers and attach them to a GitHub Release.
#
# Trigger:
#   git tag v0.1.0 && git push origin v0.1.0
#   — or run “Release” manually from the Actions tab.
#
# Windows signing (optional until SignPath is approved):
#   Repo vars/secrets:
#     SIGNPATH_ENABLED=true       (variable — enables the SignPath job)
#     SIGNPATH_API_TOKEN          (secret)
#     SIGNPATH_ORGANIZATION_ID    (variable)
#     SIGNPATH_PROJECT_SLUG       (variable, default: openpodcast)
#     SIGNPATH_SIGNING_POLICY_SLUG (variable, default: release-signing)
#     SIGNPATH_ARTIFACT_CONFIGURATION_SLUG (variable, default: windows-installers)
#
# See CODE_SIGNING.md and .signpath/artifact-configuration.xml.
# Publish always attaches macOS + Windows (signed Windows when SignPath runs).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/publish (e.g. v0.1.0). Leave empty to use package.json version."
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER="$(node -p "require('./package.json').version")"
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

  build-macos:
    needs: meta
    runs-on: macos-latest
    name: macOS (Apple Silicon)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: aarch64-apple-darwin

      - name: Install AEC build tools
        run: brew install meson ninja cmake pkg-config

      - name: Skip Apple signing identity in CI
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("src-tauri/tauri.conf.json")
          conf = json.loads(p.read_text())
          mac = conf.setdefault("bundle", {}).setdefault("macOS", {})
          mac.pop("signingIdentity", None)
          p.write_text(json.dumps(conf, indent=2) + "\n")
          print("Removed bundle.macOS.signingIdentity for unsigned CI build")
          PY

      - run: npm ci

      - name: Fetch ffmpeg sidecar
        env:
          TAURI_ENV_TARGET_TRIPLE: aarch64-apple-darwin
          FFMPEG_FORCE_FETCH: "1"
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build Tauri app
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Stage macOS artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -path '*/bundle/*' -print -exec cp {} dist-release/ \;
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist-release/*
          if-no-files-found: error

  build-windows:
    needs: meta
    runs-on: windows-latest
    name: Windows (x64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: x86_64-pc-windows-msvc

      - name: Install AEC build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja
          meson --version
          ninja --version

      - run: npm ci

      - name: Fetch ffmpeg sidecar
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
          FFMPEG_FORCE_FETCH: "1"
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build Tauri app (MSI + NSIS)
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Get-ChildItem -Path src-tauri\target -Recurse -Include `
            "OpenPodcast_*_x64_en-US.msi","OpenPodcast_*_x64-setup.exe" |
            ForEach-Object { Copy-Item $_.FullName dist-release\ -Force; $_.FullName }
          Get-ChildItem dist-release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        id: upload-unsigned-windows
        with:
          name: windows-x64-unsigned
          path: dist-release/*
          if-no-files-found: error

    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}

  sign-windows:
    needs: build-windows
    # Prefer an explicit repo variable so the job can be toggled without
    # putting secrets in `if:` (and so unsigned releases still publish).
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: windows-latest
    name: Sign Windows (SignPath)
    steps:
      - name: Require SignPath credentials
        shell: bash
        run: |
          if [[ -z "${{ secrets.SIGNPATH_API_TOKEN }}" || -z "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]]; then
            echo "SIGNPATH_ENABLED=true but SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID are missing."
            exit 1
          fi

      - name: Submit signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_PROJECT_SLUG || 'openpodcast' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-installers' }}
          github-artifact-id: ${{ needs.build-windows.outputs.unsigned-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-signed
          path: signed-windows/*
          if-no-files-found: error

  publish:
    needs: [meta, build-macos, build-windows, sign-windows]
    if: always() && needs.meta.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    name: Publish draft release
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: dist-release

      - name: Download signed Windows artifacts
        id: dl-signed
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-signed
          path: dist-release

      - name: Download unsigned Windows artifacts
        if: steps.dl-signed.outcome != 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-unsigned
          path: dist-release

      - name: List release assets
        run: ls -la dist-release

      - name: Create / update draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: OpenPodcast ${{ needs.meta.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist-release/*
          body: |
            ## Downloads
            - **Windows**: `OpenPodcast_*_x64-setup.exe` (NSIS) and/or `OpenPodcast_*_x64_en-US.msi`
            - **macOS Apple Silicon**: `OpenPodcast_*_aarch64.dmg`

            ### Windows signing
            When SignPath is connected, Windows installers are Authenticode-signed by
            **SignPath Foundation** (see CODE_SIGNING.md in the repo).
            Until then, SmartScreen may warn → More info → Run anyway.

            ### macOS Gatekeeper
            CI macOS builds are **unsigned**. Right-click → Open the first time, or replace
            this DMG with a notarized build from `scripts/sign-notarize-dmg.sh`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
